{% extends "base.html" %}

{% block header %}
<form id="filter" class="filter"></form>
<label for="filter-type">Filter by:
  <select id="filter-type" name="filter-type">
    <option value="default" id="default" disabled selected>Filter</option>
    <option value="area">years</option>
  </select>
</label>

{% endblock %}

{% block content %}
<div class="timeline my-auto flex gap-4">
  {% for mission in missions %}
  <div class="mission-card border">
    <h2>{{ mission.mission }}</h2>

    <div class="mission-modal">
      <p>{{ mission.description }}</p>
    </div>

  </div>
  {% endfor %}
</div>
{% endblock %}
