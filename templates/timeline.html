{% extends "base.html" %}

{% block header %}
<form id="filter">
  <input type="text" id="filter-input" name="filter" placeholder="filter" required>
  <button type="submit">Submit</button>
</form>
{% endblock %}

{% block content %}
<div class="timeline my-auto flex gap-4">
  {% for mission in missions %}
  <div class="mission-card border">
    <h2>{{ mission.mission }}</h2>

    <div class="mission-modal">
      <p>{{ mission.description }}</p>
    </div>

  </div>
  {% endfor %}
</div>
{% endblock %}
