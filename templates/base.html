<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Mission Line{% endblock %}</title>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <!-- Tailwind -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" defer></script>

  <!-- JavaScript Render && Fetch Logic -->
  <script src="{{ url_for('static', filename='render.js') }}" defer></script>
</head>

<body class='min-h-screen flex flex-col'>
  <header>{% block header %}{% endblock %}</header>

  <main class='flex flex-1 p-4'>
    {% block content %}{% endblock %}
  </main>

  <footer>{% block footer %}{% endblock %}</footer>
</body>

<!-- JavaScript Render && Fetch Logic -->
<script src="{{ url_for('static', filename='render.js') }}"></script>

</html>
